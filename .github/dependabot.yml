version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dependencies"
    schedule:
      interval: "daily"
    groups:
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "-"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
